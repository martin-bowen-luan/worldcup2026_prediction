<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 FIFA 世界杯预测</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#f0f4f8; --bg2:#ffffff; --bg3:#e8edf4;
  --gold:#d4890a; --text:#1a2636; --dim:#6b7c93;
  --bd:#c8d6e5; --bdhi:#9ab4cc;
  --green:#1e9e3a; --blue:#1a6abf; --purple:#6a3fbf;
}
body { font-family:'Segoe UI','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* ── Header ── */
header { background:var(--bg2); border-bottom:2px solid var(--gold); padding:9px 20px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.logo { font-size:20px; font-weight:800; color:var(--gold); }
.tagline { font-size:12px; color:var(--dim); margin-top:2px; }
.btn { padding:6px 14px; border:1px solid var(--gold); background:transparent; color:var(--gold); border-radius:5px; cursor:pointer; font-size:13px; font-family:inherit; transition:all .15s; font-weight:600; }
.btn:hover { background:var(--gold); color:#fff; }

/* ── Tabs ── */
.tabs { display:flex; background:var(--bg2); border-bottom:2px solid var(--bd); flex-shrink:0; }
.tab-btn { padding:9px 24px; background:transparent; color:var(--dim); border:none; border-bottom:2px solid transparent; margin-bottom:-2px; cursor:pointer; font-size:14px; font-family:inherit; transition:all .15s; font-weight:500; }
.tab-btn.active { color:var(--gold); border-bottom-color:var(--gold); font-weight:700; }
.tab-btn:hover:not(.active) { color:var(--text); background:var(--bg); }

/* ── Shared banner ── */
#shared-banner {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 20px; background:#e8f5e9; border-bottom:1px solid #81c784;
  flex-shrink:0; gap:10px; font-size:13px; color:#2e7d32;
}
.sbtn { padding:4px 12px; border:1px solid #4caf50; background:transparent; color:#2e7d32; border-radius:4px; cursor:pointer; font-size:12px; font-family:inherit; transition:all .15s; font-weight:600; }
.sbtn:hover { background:#4caf50; color:#fff; }
.sbtn-x { border-color:#adbfad; color:#6a7c6a; }
.sbtn-x:hover { background:#d4e8d4; color:#2e7d32; border-color:#4caf50; }

/* ── Panes ── */
.tab-pane { flex:1; overflow:hidden; display:none; flex-direction:column; }
.tab-pane.active { display:flex; }

/* ══════════ GROUP STAGE ══════════ */
.gs-outer { flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 16px 40px; }

.groups-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
  gap:12px;
  margin-bottom:16px;
}

/* Group card */
.gs-card { background:var(--bg2); border:1px solid var(--bd); border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.gs-card-hdr { padding:6px 12px; font-size:13px; font-weight:700; }
.gs-card-hdr.left  { background:rgba(212,137,10,.1); color:var(--gold); border-bottom:1px solid rgba(212,137,10,.2); }
.gs-card-hdr.right { background:rgba(106,63,191,.1); color:var(--purple); border-bottom:1px solid rgba(106,63,191,.2); }

/* Standings */
.gs-standings { padding:6px 10px 4px; }
.st-row {
  display:grid;
  grid-template-columns:16px 1fr 28px 22px 22px 22px 30px;
  align-items:center;
  font-size:12px;
  padding:3px 2px;
  border-radius:4px;
  gap:1px;
}
.st-hdr { color:var(--dim); font-size:11px; margin-bottom:2px; }
.st-q1 { background:rgba(30,158,58,.14); }
.st-q2 { background:rgba(26,106,191,.12); }
.st-q3 { background:rgba(212,137,10,.12); }
.sn  { text-align:center; color:var(--dim); }
.steam { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.sv  { text-align:center; color:var(--dim); }
.sp  { font-weight:700; color:var(--text); }
.sq1 { color:#1a7a2e; font-weight:700; }
.sq2 { color:#1452a0; font-weight:700; }
.sq3 { color:#b36a00; font-weight:700; }

/* Matches */
.gs-matches { border-top:1px solid var(--bd); padding:6px 10px 8px; background:var(--bg); }
.gs-round-lbl {
  font-size:11px; color:var(--dim);
  padding:5px 0 3px; margin-top:3px;
  border-top:1px solid var(--bd);
  letter-spacing:.03em; font-weight:600;
}
.gs-round-lbl:first-child { border-top:none; margin-top:0; padding-top:0; }
.gs-match {
  display:grid;
  grid-template-columns:1fr 34px 14px 34px 1fr;
  align-items:center;
  gap:4px;
  padding:3px 0;
}
.gm-l { text-align:right; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.gm-r { text-align:left;  font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.gm-sep  { text-align:center; color:var(--dim); font-size:13px; font-weight:700; }
.score-inp {
  width:34px; padding:3px 4px;
  background:#fff; border:1.5px solid var(--bd); border-radius:4px;
  color:var(--text); font-size:14px; font-weight:700; text-align:center;
  font-family:inherit; display:block;
}
.score-inp::-webkit-outer-spin-button,
.score-inp::-webkit-inner-spin-button { -webkit-appearance:none; }
.score-inp[type=number] { -moz-appearance:textfield; }
.score-inp:focus { outline:none; border-color:var(--gold); background:#fffcf0; }
.gs-match.done .score-inp { border-color:var(--bdhi); background:#f8f9fa; }

/* Thirds section */
.thirds-card { background:var(--bg2); border:1px solid var(--bd); border-radius:8px; padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.thirds-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.thirds-title span { font-size:12px; font-weight:400; color:var(--dim); }
.thirds-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:5px; }
.third-row {
  display:flex; align-items:center; gap:7px;
  padding:5px 10px; border-radius:6px;
  background:var(--bg); border:1px solid var(--bd);
  font-size:12px;
}
.third-row.adv { border-color:rgba(212,137,10,.5); background:rgba(212,137,10,.07); }
.third-row.adv .trn { color:var(--gold); }
.trn  { font-weight:700; color:var(--dim); width:18px; text-align:center; flex-shrink:0; }
.trg  { color:var(--dim); width:16px; text-align:center; flex-shrink:0; font-size:11px; font-weight:700; }
.trt  { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.trp  { color:var(--dim); font-size:11px; white-space:nowrap; flex-shrink:0; }
.trbadge { background:var(--gold); color:#fff; padding:2px 7px; border-radius:3px; font-size:10px; font-weight:700; flex-shrink:0; }

/* Legend */
.gs-legend { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; font-size:12px; color:var(--dim); }
.gs-legend span { display:flex; align-items:center; gap:5px; }
.ldot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }

/* ══════════ KNOCKOUT TAB ══════════ */
.pool-section { padding:10px 18px 8px; background:var(--bg2); border-bottom:1px solid var(--bd); flex-shrink:0; }
.pool-meta { display:flex; align-items:center; gap:10px; margin-bottom:7px; font-size:13px; color:var(--dim); flex-wrap:wrap; }
.pool-meta strong { color:var(--gold); font-size:14px; }
.legend { display:flex; flex-wrap:wrap; gap:8px; }
.legend span { display:flex; align-items:center; gap:4px; font-size:12px; white-space:nowrap; }
.dot { display:inline-block; width:7px; height:7px; border-radius:50%; flex-shrink:0; }

.groups-rows { overflow-x:auto; }
.groups-row  { display:flex; gap:6px; margin-bottom:5px; min-width:max-content; }
.group-card  { background:var(--bg); border:1px solid var(--bd); border-radius:6px; padding:5px 6px; }
.group-hdr   { font-size:11px; font-weight:700; text-align:center; padding-bottom:4px; margin-bottom:4px; border-bottom:1px solid var(--bd); }
.group-hdr.left  { color:var(--gold); }
.group-hdr.right { color:var(--purple); }

.tc { display:flex; align-items:center; gap:4px; padding:4px 8px; margin-bottom:3px; background:var(--bg2); border:1px solid var(--bd); border-radius:4px; cursor:pointer; user-select:none; font-size:12px; white-space:nowrap; transition:border-color .12s,background .12s,transform .1s; }
.tc:last-child { margin-bottom:0; }
.tc:hover { border-color:var(--gold); background:#fffbf0; transform:scale(1.02); }
.tc:active { transform:scale(.97); }
.tc.used  { opacity:.35; cursor:default; pointer-events:none; }

.bracket-outer { flex:1; overflow:auto; padding:16px 20px 40px; }
.bracket-wrap  { display:flex; align-items:stretch; gap:2px; min-height:720px; }
.bk-half { display:flex; align-items:stretch; gap:0; }

.round-col { display:flex; flex-direction:column; flex-shrink:0; }
.round-title { text-align:center; font-size:12px; font-weight:700; color:var(--gold); padding:4px 8px; background:rgba(212,137,10,.08); border:1px solid rgba(212,137,10,.3); border-radius:5px; margin-bottom:6px; white-space:nowrap; }
.round-title sub { font-weight:400; font-size:10px; color:var(--dim); margin-left:3px; }
.sg  { flex:1; display:flex; flex-direction:column; justify-content:space-around; }
.sg2 { flex:1; display:grid; grid-template-columns:repeat(2,114px); grid-template-rows:repeat(8,1fr); grid-auto-flow:column; gap:4px; }

.slot { width:114px; height:36px; background:var(--bg); border:1.5px solid var(--bd); border-radius:6px; display:flex; align-items:center; overflow:hidden; position:relative; flex-shrink:0; }
.slot.filled { border-style:solid; border-color:var(--bdhi); background:var(--bg2); }
.slot.filled:hover { border-color:var(--gold); }
.slot-empty { width:100%; text-align:center; font-size:11px; color:var(--bd); pointer-events:none; }
.slot-team { display:flex; align-items:center; gap:5px; padding:0 22px 0 7px; width:100%; height:100%; cursor:pointer; font-size:12px; user-select:none; transition:background .12s; }
.slot.filled:hover .slot-team { background:rgba(212,137,10,.06); }
.slot-x { position:absolute; right:4px; width:14px; height:14px; background:rgba(220,50,50,.85); border-radius:50%; display:none; align-items:center; justify-content:center; font-size:9px; cursor:pointer; color:#fff; flex-shrink:0; }
.slot.filled:hover .slot-x { display:flex; }
.slot.is-champ { width:142px; height:64px; border:2px solid var(--gold); border-style:solid; background:#fffbf0; }
.slot.is-champ .slot-team { flex-direction:column; justify-content:center; font-size:15px; gap:2px; padding:0 18px; text-align:center; }
.slot.is-champ .slot-empty { color:rgba(212,137,10,.4); font-size:12px; }
.slot.is-champ:hover { border-color:var(--gold) !important; }

/* Match pair (r32 bracket) */
.match-pair { display:flex; flex-direction:column; border:1.5px solid var(--bd); border-radius:7px; overflow:hidden; background:var(--bg); }
.match-pair > .slot { width:100%; border:none; border-radius:0; flex-shrink:1; }
.match-pair > .slot + .slot { border-top:1px solid var(--bg3); }
.match-pair > .slot.filled { background:var(--bg2); }
.match-pair > .slot.filled:hover { border-color:transparent; }

.center-col { display:flex; flex-direction:column; align-items:center; flex-shrink:0; padding:0 10px; }
.center-inner { flex:1; display:flex; flex-direction:column; justify-content:space-around; align-items:center; width:100%; }
.champ-block { display:flex; flex-direction:column; align-items:center; gap:4px; }
.champ-title { text-align:center; font-size:14px; font-weight:700; color:var(--gold); padding:5px 14px; background:rgba(212,137,10,.1); border:1.5px solid var(--gold); border-radius:6px; white-space:nowrap; }
.champ-title sub { font-weight:400; font-size:10px; color:var(--dim); margin-left:3px; }
.fin-title { text-align:center; font-size:12px; font-weight:700; color:var(--gold); padding:4px 10px; background:rgba(212,137,10,.08); border:1px solid rgba(212,137,10,.3); border-radius:5px; margin-bottom:6px; white-space:nowrap; }
.fin-title sub { font-weight:400; font-size:10px; color:var(--dim); margin-left:3px; }
.arr { color:var(--bd); font-size:20px; align-self:center; user-select:none; flex-shrink:0; padding:0 2px; }

/* Toast */
#toast { position:fixed; bottom:24px; right:24px; background:var(--text); border:1px solid var(--gold); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.15); }
#toast.on { opacity:1; transform:none; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--bd); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--bdhi); }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">⚽ 2026 FIFA 世界杯 — 我的预测</div>
    <div class="tagline">小组赛预测比分 → 自动计算积分榜 → 淘汰赛预测</div>
  </div>
  <div style="display:flex;gap:6px">
    <button class="btn" onclick="shareLink()">📤 分享链接</button>
    <button class="btn" onclick="resetAll()">🔄 重置全部</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" id="tbg" onclick="switchTab('group')">⚽ 小组赛</button>
  <button class="tab-btn"        id="tbk" onclick="switchTab('knockout')">🏆 淘汰赛</button>
</nav>

<div id="shared-banner" style="display:none">
  <span>📤 正在查看分享的预测（只读）</span>
  <div style="display:flex;gap:6px">
    <button class="sbtn" onclick="adoptShared()">💾 保存为我的预测</button>
    <button class="sbtn sbtn-x" onclick="clearShared()">✕ 关闭</button>
  </div>
</div>

<!-- GROUP STAGE PANE -->
<div id="pane-group" class="tab-pane active">
  <div class="gs-outer">
    <div class="gs-legend">
      <span><span class="ldot" style="background:#3ecf5e"></span>直接晋级（第1、2名）</span>
      <span><span class="ldot" style="background:#f5a623"></span>可能晋级（第3名，视最佳第三名排名）</span>
      <span><span class="ldot" style="background:#2e4464"></span>淘汰（第4名）</span>
    </div>
    <div id="groups-grid" class="groups-grid"></div>
    <div id="thirds-section" class="thirds-card"></div>
  </div>
</div>

<!-- KNOCKOUT PANE -->
<div id="pane-knockout" class="tab-pane">
  <div class="pool-section">
    <div class="pool-meta">
      <strong>🌍 分组（点击球队进入32强）</strong>
      <span id="pool-info">48 支队伍</span>
      <button class="btn" onclick="autoFillR32()" style="padding:4px 12px;font-size:12px">⚡ 从小组赛生成32强</button>
      <div class="legend">
        <span><span class="dot" style="background:#4a9fff"></span>UEFA</span>
        <span><span class="dot" style="background:#3ecf5e"></span>CONMEBOL</span>
        <span><span class="dot" style="background:#ff6b4a"></span>CONCACAF</span>
        <span><span class="dot" style="background:#f5d623"></span>CAF</span>
        <span><span class="dot" style="background:#ff9f3e"></span>AFC</span>
        <span><span class="dot" style="background:#cc88ff"></span>OFC</span>
      </div>
    </div>
    <div id="pool" class="groups-rows"></div>
  </div>
  <div class="bracket-outer">
    <div id="bracket" class="bracket-wrap"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Confederation colors ──────────────────────────────────
const CC = { UEFA:'#4a9fff', CONMEBOL:'#3ecf5e', CONCACAF:'#ff6b4a', CAF:'#f5d623', AFC:'#ff9f3e', OFC:'#cc88ff' };

// ── Groups & Teams ────────────────────────────────────────
const GROUPS = [
  { name:'A', left:true, teams:[
    {id:'mx',name:'墨西哥',      flag:'🇲🇽',conf:'CONCACAF',host:true},
    {id:'za',name:'南非',        flag:'🇿🇦',conf:'CAF'},
    {id:'kr',name:'韩国',        flag:'🇰🇷',conf:'AFC'},
    {id:'cz',name:'捷克',        flag:'🇨🇿',conf:'UEFA'},
  ]},
  { name:'B', left:true, teams:[
    {id:'ca',name:'加拿大',      flag:'🇨🇦',conf:'CONCACAF',host:true},
    {id:'ba',name:'波黑',        flag:'🇧🇦',conf:'UEFA'},
    {id:'qa',name:'卡塔尔',      flag:'🇶🇦',conf:'AFC'},
    {id:'ch',name:'瑞士',        flag:'🇨🇭',conf:'UEFA'},
  ]},
  { name:'C', left:true, teams:[
    {id:'br',name:'巴西',        flag:'🇧🇷',conf:'CONMEBOL'},
    {id:'ma',name:'摩洛哥',      flag:'🇲🇦',conf:'CAF'},
    {id:'ht',name:'海地',        flag:'🇭🇹',conf:'CONCACAF'},
    {id:'sc',name:'苏格兰',      flag:'🏴󠁧󠁢󠁳󠁣󠁴󠁿',conf:'UEFA'},
  ]},
  { name:'D', left:true, teams:[
    {id:'us',name:'美国',        flag:'🇺🇸',conf:'CONCACAF',host:true},
    {id:'py',name:'巴拉圭',      flag:'🇵🇾',conf:'CONMEBOL'},
    {id:'au',name:'澳大利亚',    flag:'🇦🇺',conf:'AFC'},
    {id:'tr',name:'土耳其',      flag:'🇹🇷',conf:'UEFA'},
  ]},
  { name:'E', left:true, teams:[
    {id:'de',name:'德国',        flag:'🇩🇪',conf:'UEFA'},
    {id:'cw',name:'库拉索',      flag:'🇨🇼',conf:'CONCACAF'},
    {id:'ci',name:'科特迪瓦',    flag:'🇨🇮',conf:'CAF'},
    {id:'ec',name:'厄瓜多尔',    flag:'🇪🇨',conf:'CONMEBOL'},
  ]},
  { name:'F', left:true, teams:[
    {id:'nl',name:'荷兰',        flag:'🇳🇱',conf:'UEFA'},
    {id:'jp',name:'日本',        flag:'🇯🇵',conf:'AFC'},
    {id:'se',name:'瑞典',        flag:'🇸🇪',conf:'UEFA'},
    {id:'tn',name:'突尼斯',      flag:'🇹🇳',conf:'CAF'},
  ]},
  { name:'G', left:false, teams:[
    {id:'be',name:'比利时',      flag:'🇧🇪',conf:'UEFA'},
    {id:'eg',name:'埃及',        flag:'🇪🇬',conf:'CAF'},
    {id:'ir',name:'伊朗',        flag:'🇮🇷',conf:'AFC'},
    {id:'nz',name:'新西兰',      flag:'🇳🇿',conf:'OFC'},
  ]},
  { name:'H', left:false, teams:[
    {id:'es',name:'西班牙',      flag:'🇪🇸',conf:'UEFA'},
    {id:'cv',name:'佛得角',      flag:'🇨🇻',conf:'CAF'},
    {id:'sa',name:'沙特阿拉伯',  flag:'🇸🇦',conf:'AFC'},
    {id:'uy',name:'乌拉圭',      flag:'🇺🇾',conf:'CONMEBOL'},
  ]},
  { name:'I', left:false, teams:[
    {id:'fr',name:'法国',        flag:'🇫🇷',conf:'UEFA'},
    {id:'iq',name:'伊拉克',      flag:'🇮🇶',conf:'AFC'},
    {id:'no',name:'挪威',        flag:'🇳🇴',conf:'UEFA'},
    {id:'sn',name:'塞内加尔',    flag:'🇸🇳',conf:'CAF'},
  ]},
  { name:'J', left:false, teams:[
    {id:'ar',name:'阿根廷',      flag:'🇦🇷',conf:'CONMEBOL'},
    {id:'dz',name:'阿尔及利亚',  flag:'🇩🇿',conf:'CAF'},
    {id:'at',name:'奥地利',      flag:'🇦🇹',conf:'UEFA'},
    {id:'jo',name:'约旦',        flag:'🇯🇴',conf:'AFC'},
  ]},
  { name:'K', left:false, teams:[
    {id:'co',name:'哥伦比亚',    flag:'🇨🇴',conf:'CONMEBOL'},
    {id:'cd',name:'刚果（金）',  flag:'🇨🇩',conf:'CAF'},
    {id:'pt',name:'葡萄牙',      flag:'🇵🇹',conf:'UEFA'},
    {id:'uz',name:'乌兹别克斯坦',flag:'🇺🇿',conf:'AFC'},
  ]},
  { name:'L', left:false, teams:[
    {id:'hr',name:'克罗地亚',    flag:'🇭🇷',conf:'UEFA'},
    {id:'en',name:'英格兰',      flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',conf:'UEFA'},
    {id:'gh',name:'加纳',        flag:'🇬🇭',conf:'CAF'},
    {id:'pa',name:'巴拿马',      flag:'🇵🇦',conf:'CONCACAF'},
  ]},
];
const TEAMS = GROUPS.flatMap(g => g.teams);

// ── Match pairs (index into group.teams) & 3-round schedule ──
// PAIRS[i] = [teamA_idx, teamB_idx], score key = "${group}-${i}"
const PAIRS = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
// Standard round-robin schedule: each round has 2 simultaneous matches
const GS_ROUNDS = [
  { label:'第 1 轮', mi:[0, 5] },   // [0v1, 2v3]
  { label:'第 2 轮', mi:[1, 4] },   // [0v2, 1v3]
  { label:'第 3 轮', mi:[2, 3] },   // [0v3, 1v2]
];

// ── Knockout rounds ───────────────────────────────────────
const RL = [
  {id:'r32L', label:'⚽ 32强', count:16, cols:2},
  {id:'r16L', label:'⚡ 16强', count:8,  cols:1},
  {id:'qfL',  label:'🔥 八强', count:4,  cols:1},
  {id:'sfL',  label:'🌟 四强', count:2,  cols:1},
];
const RR = [
  {id:'sfR',  label:'🌟 四强', count:2,  cols:1},
  {id:'qfR',  label:'🔥 八强', count:4,  cols:1},
  {id:'r16R', label:'⚡ 16强', count:8,  cols:1},
  {id:'r32R', label:'⚽ 32强', count:16, cols:2},
];
const ROUND_COUNT = { r32L:16,r16L:8,qfL:4,sfL:2, r32R:16,r16R:8,qfR:4,sfR:2, fin:2,champ:1 };
const NEXT_RID    = { r32L:'r16L',r16L:'qfL',qfL:'sfL', r32R:'r16R',r16R:'qfR',qfR:'sfR', sfL:'fin',sfR:'fin',fin:'champ' };
const NEXT_LABEL  = { r32L:'16强',r16L:'八强',qfL:'四强',sfL:'决赛', r32R:'16强',r16R:'八强',qfR:'四强',sfR:'决赛', fin:'冠军' };

// ── R32 match pairings (matches 73-88 per official draw) ─────────────────
// ta/tb: {rank:1|2=group place, grp} or {rank:3, el:[eligible groups for best-3rd]}
const R32_MATCHES = [
  // Left half (r32L, slots 0-15 as 8 consecutive pairs)
  {match:73, rid:'r32L', ai:0,  bi:1,  ta:{rank:2,grp:'A'}, tb:{rank:2,grp:'B'}},
  {match:74, rid:'r32L', ai:2,  bi:3,  ta:{rank:1,grp:'E'}, tb:{rank:3,el:['A','B','C','D','F']}},
  {match:75, rid:'r32L', ai:4,  bi:5,  ta:{rank:1,grp:'F'}, tb:{rank:2,grp:'C'}},
  {match:76, rid:'r32L', ai:6,  bi:7,  ta:{rank:1,grp:'C'}, tb:{rank:2,grp:'F'}},
  {match:79, rid:'r32L', ai:8,  bi:9,  ta:{rank:1,grp:'A'}, tb:{rank:3,el:['C','E','F','H','I']}},
  {match:81, rid:'r32L', ai:10, bi:11, ta:{rank:1,grp:'D'}, tb:{rank:3,el:['B','E','F','I','J']}},
  {match:85, rid:'r32L', ai:12, bi:13, ta:{rank:1,grp:'B'}, tb:{rank:3,el:['E','F','G','I','J']}},
  {match:78, rid:'r32L', ai:14, bi:15, ta:{rank:2,grp:'E'}, tb:{rank:2,grp:'I'}},
  // Right half (r32R, slots 0-15 as 8 consecutive pairs)
  {match:77, rid:'r32R', ai:0,  bi:1,  ta:{rank:1,grp:'I'}, tb:{rank:3,el:['C','D','F','G','H']}},
  {match:82, rid:'r32R', ai:2,  bi:3,  ta:{rank:1,grp:'G'}, tb:{rank:3,el:['A','E','H','I','J']}},
  {match:80, rid:'r32R', ai:4,  bi:5,  ta:{rank:1,grp:'L'}, tb:{rank:3,el:['E','H','I','J','K']}},
  {match:87, rid:'r32R', ai:6,  bi:7,  ta:{rank:1,grp:'K'}, tb:{rank:3,el:['D','E','I','J','L']}},
  {match:88, rid:'r32R', ai:8,  bi:9,  ta:{rank:2,grp:'D'}, tb:{rank:2,grp:'G'}},
  {match:84, rid:'r32R', ai:10, bi:11, ta:{rank:1,grp:'H'}, tb:{rank:2,grp:'J'}},
  {match:86, rid:'r32R', ai:12, bi:13, ta:{rank:1,grp:'J'}, tb:{rank:2,grp:'H'}},
  {match:83, rid:'r32R', ai:14, bi:15, ta:{rank:2,grp:'K'}, tb:{rank:2,grp:'L'}},
];

// ── State ─────────────────────────────────────────────────
let slots  = {};   // knockout bracket
let scores = {};   // group stage predicted scores  { 'A-0': {h:2,a:1}, ... }

function save()       { localStorage.setItem('wc26_br',  JSON.stringify(slots));  }
function load()       { try { slots  = JSON.parse(localStorage.getItem('wc26_br') ||'{}'); } catch{ slots={}; } }
function saveScores() { localStorage.setItem('wc26_sc',  JSON.stringify(scores)); }
function loadScores() { try { scores = JSON.parse(localStorage.getItem('wc26_sc')||'{}'); } catch{ scores={}; } }
function byId(id)     { return TEAMS.find(t=>t.id===id); }
function placed()     { return new Set(Object.values(slots).filter(Boolean)); }

// ── Toast ─────────────────────────────────────────────────
let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(_tt); _tt = setTimeout(()=>el.classList.remove('on'), 2000);
}

// ── Tabs ──────────────────────────────────────────────────
function switchTab(t) {
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));

  document.getElementById('tb'+t[0]).classList.add('active');

// ══════════ GROUP STAGE LOGIC ══════════

function getStandings(grpName) {
  const g  = GROUPS.find(x=>x.name===grpName);
  const st = g.teams.map(t=>({...t, p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}));
  PAIRS.forEach(([i,j],mi) => {
    const s = scores[`${grpName}-${mi}`];
    if (!s || s.h==null || s.a==null) return;
    const h=+s.h, a=+s.a;
    st[i].p++; st[j].p++;
    st[i].gf+=h; st[i].ga+=a;
    st[j].gf+=a; st[j].ga+=h;
    if (h>a)      { st[i].w++; st[i].pts+=3; st[j].l++; }
    else if (h<a) { st[j].w++; st[j].pts+=3; st[i].l++; }
    else          { st[i].d++; st[i].pts++; st[j].d++; st[j].pts++; }
  });
  st.forEach(t=>t.gd=t.gf-t.ga);
  return [...st].sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}

function buildStandingsHTML(st) {
  const qcls = ['sq1 st-q1','sq2 st-q2','sq3 st-q3',''];
  const hdr = `<div class="st-row st-hdr">
    <span class="sn">#</span><span class="steam">球队</span>
    <span class="sv">积</span><span class="sv">W</span><span class="sv">D</span><span class="sv">L</span><span class="sv">净</span>
  </div>`;
  return hdr + st.map((t,r)=>{
    const gd = t.gd>0?'+'+t.gd:t.gd;
    return `<div class="st-row ${qcls[r]}">
      <span class="sn">${r+1}</span>
      <span class="steam">${t.flag} ${t.name}</span>
      <span class="sv sp">${t.pts}</span>
      <span class="sv">${t.w}</span><span class="sv">${t.d}</span><span class="sv">${t.l}</span>
      <span class="sv">${gd}</span>
    </div>`;
  }).join('');
}

function getAllThirds() {
  return GROUPS.map(g=>{
    const st=getStandings(g.name);
    return {...st[2], srcGroup:g.name};
  }).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}

function renderGroupStage() {
  const grid = document.getElementById('groups-grid');
  grid.innerHTML = '';
  GROUPS.forEach(g => grid.appendChild(buildGroupCard(g)));
  renderThirdsSection();
}

function buildGroupCard(g) {
  const card = document.createElement('div');
  card.className = 'gs-card';
  card.dataset.group = g.name;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'gs-card-hdr '+(g.left?'left':'right');
  hdr.textContent = (g.left?'▶ ':'◀ ')+g.name+'组';
  card.appendChild(hdr);

  // Standings (updatable region)
  const stDiv = document.createElement('div');
  stDiv.className = 'gs-standings';
  stDiv.innerHTML = buildStandingsHTML(getStandings(g.name));
  card.appendChild(stDiv);

  // Matches grouped by round (static DOM, inputs persist)
  const mDiv = document.createElement('div');
  mDiv.className = 'gs-matches';

  GS_ROUNDS.forEach(rd => {
    const lbl = document.createElement('div');
    lbl.className = 'gs-round-lbl';
    lbl.textContent = rd.label;
    mDiv.appendChild(lbl);

    rd.mi.forEach(mi => {
      const [i, j] = PAIRS[mi];
      const sid  = `${g.name}-${mi}`;
      const s    = scores[sid] || {};
      const ta   = g.teams[i], tb = g.teams[j];

      const row = document.createElement('div');
      row.className = 'gs-match' + (s.h!=null&&s.a!=null?' done':'');

      const makeInp = (side) => {
        const inp = document.createElement('input');
        inp.type='number'; inp.min='0'; inp.className='score-inp'; inp.placeholder='?';
        const val = s[side];
        if (val!=null) inp.value = val;
        inp.addEventListener('input', () => {
          if (!scores[sid]) scores[sid]={};
          const v = inp.value.trim();
          scores[sid][side] = v==='' ? null : Math.max(0, parseInt(v)||0);
          if (scores[sid].h==null && scores[sid].a==null) delete scores[sid];
          saveScores();
          const c = document.querySelector(`.gs-card[data-group="${g.name}"]`);
          if (c) {
            c.querySelector('.gs-standings').innerHTML = buildStandingsHTML(getStandings(g.name));
            row.classList.toggle('done', scores[sid]?.h!=null && scores[sid]?.a!=null);
          }
          renderThirdsSection();
        });
        return inp;
      };

      const lSpan = document.createElement('span');
      lSpan.className = 'gm-l'; lSpan.textContent = `${ta.flag} ${ta.name}`;
      const sep = document.createElement('span');
      sep.className = 'gm-sep'; sep.textContent = ':';
      const rSpan = document.createElement('span');
      rSpan.className = 'gm-r'; rSpan.textContent = `${tb.name} ${tb.flag}`;

      row.appendChild(lSpan);
      row.appendChild(makeInp('h'));
      row.appendChild(sep);
      row.appendChild(makeInp('a'));
      row.appendChild(rSpan);
      mDiv.appendChild(row);
    });
  });
  card.appendChild(mDiv);
  return card;
}

function renderThirdsSection() {
  const el = document.getElementById('thirds-section');
  if (!el) return;
  const thirds = getAllThirds();
  let html = `<div class="thirds-title">🥉 各组第三名排名 <span>前8名晋级32强</span></div>
  <div class="thirds-grid">`;
  thirds.forEach((t,idx)=>{
    const adv = idx<8;
    const gd  = t.gd>0?'+'+t.gd:t.gd;
    html += `<div class="third-row${adv?' adv':''}">
      <span class="trn">${idx+1}</span>
      <span class="trg">${t.srcGroup}</span>
      <span class="trt">${t.flag} ${t.name}</span>
      <span class="trp">${t.pts}分 ${gd}</span>
      ${adv?'<span class="trbadge">晋级</span>':''}
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

// ══════════ KNOCKOUT LOGIC ══════════

function advance(tid, fromRid) {
  const t = byId(tid);
  const nextRid = NEXT_RID[fromRid];
  if (!nextRid) { toast(`🏆 ${t.name} 已是最终冠军！`); return; }

  let targetSid;
  if (fromRid==='sfL') {
    if (slots['fin-0']===tid) { toast(`${t.name} 已在决赛`); return; }
    if (slots['fin-0'])       { toast('决赛席位已满'); return; }
    targetSid = 'fin-0';
  } else if (fromRid==='sfR') {
    if (slots['fin-1']===tid) { toast(`${t.name} 已在决赛`); return; }
    if (slots['fin-1'])       { toast('决赛席位已满'); return; }
    targetSid = 'fin-1';
  } else if (fromRid==='fin') {
    if (slots['champ-0']===tid) { toast(`🏆 ${t.name} 已是冠军`); return; }
    if (slots['champ-0'])       { toast('冠军席位已满'); return; }
    targetSid = 'champ-0';
  } else {
    const cnt = ROUND_COUNT[nextRid];
    for (let i=0;i<cnt;i++) if (slots[`${nextRid}-${i}`]===tid) { toast(`${t.name} 已在下一轮`); return; }
    targetSid = null;
    for (let i=0;i<cnt;i++) if (!slots[`${nextRid}-${i}`]) { targetSid=`${nextRid}-${i}`; break; }
    if (!targetSid) { toast('下一轮已满，请先移除队伍'); return; }
  }
  slots[targetSid]=tid; save(); renderBracket(); renderPool();
  toast(`${t.name} 晋级！`);
}

function addToR32(tid) {
  const t   = byId(tid);
  const grp = GROUPS.find(g=>g.teams.find(t2=>t2.id===tid));
  const rid = grp.left?'r32L':'r32R';
  const cnt = ROUND_COUNT[rid];
  for (let i=0;i<cnt;i++) if (slots[`${rid}-${i}`]===tid) { toast(`${t.name} 已在32强`); return; }
  let targetSid=null;
  for (let i=0;i<cnt;i++) if (!slots[`${rid}-${i}`]) { targetSid=`${rid}-${i}`; break; }
  if (!targetSid) { toast('32强已满，请先移除队伍'); return; }
  slots[targetSid]=tid; save(); renderBracket(); renderPool();
  toast(`${t.name} 进入32强`);
}

function autoFillR32() {
  // Calculate current group standings
  const st = {};
  GROUPS.forEach(g => { st[g.name] = getStandings(g.name); });

  // Rank all 12 third-place teams
  const allThirds = GROUPS.map(g => ({...st[g.name][2], srcGroup:g.name}))
    .sort((a,b) => b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);
  const top8 = allThirds.slice(0, 8);

  // Assign 3rd-place teams: process most-constrained match first
  const thirdSlots = R32_MATCHES
    .filter(m => m.tb.rank === 3)
    .map(m => ({ sid:`${m.rid}-${m.bi}`, eligible: top8.filter(t => m.tb.el.includes(t.srcGroup)) }))
    .sort((a,b) => a.eligible.length - b.eligible.length);
  const used = new Set();
  const thirds = {};
  thirdSlots.forEach(({sid, eligible}) => {
    for (const t of eligible) {
      if (!used.has(t.id)) { thirds[sid] = t.id; used.add(t.id); break; }
    }
  });

  // Rebuild r32 slots; keep r16 and beyond unchanged
  const newSlots = {};
  Object.entries(slots).forEach(([k,v]) => { if (!k.startsWith('r32')) newSlots[k] = v; });
  R32_MATCHES.forEach(m => {
    const sidA = `${m.rid}-${m.ai}`, sidB = `${m.rid}-${m.bi}`;
    const tA = st[m.ta.grp][m.ta.rank - 1];
    if (tA) newSlots[sidA] = tA.id;
    if (m.tb.rank <= 2) {
      const tB = st[m.tb.grp][m.tb.rank - 1];
      if (tB) newSlots[sidB] = tB.id;
    } else if (thirds[sidB]) {
      newSlots[sidB] = thirds[sidB];
    }
  });

  slots = newSlots;
  save(); renderBracket(); renderPool();
  toast('已根据小组赛成绩生成32强！');
}

function renderPool() {
  const pool = document.getElementById('pool');
  if (!pool) return;
  const used = placed();
  document.getElementById('pool-info').textContent =
    `${TEAMS.length-used.size} / ${TEAMS.length} 支队伍未晋级`;
  pool.innerHTML='';
  ['left','right'].forEach(side=>{
    const row=document.createElement('div'); row.className='groups-row';
    GROUPS.filter(g=>g.left===(side==='left')).forEach(g=>{
      const card=document.createElement('div'); card.className='group-card';
      const hdr=document.createElement('div'); hdr.className='group-hdr '+side;
      hdr.textContent=(side==='left'?'▶ ':'◀ ')+g.name+'组';
      card.appendChild(hdr);
      g.teams.forEach(t=>{
        const isUsed=used.has(t.id);
        const el=document.createElement('div');
        el.className='tc'+(isUsed?' used':'');
        el.title=isUsed?`${t.name} 已晋级`:`点击 → ${t.name} 进入32强`;
        el.innerHTML=`<span class="dot" style="background:${CC[t.conf]}"></span><span>${t.flag}</span><span>${t.name}</span>`+(t.host?'<span style="font-size:9px;color:var(--gold)">★</span>':'');
        if (!isUsed) el.addEventListener('click',()=>addToR32(t.id));
        card.appendChild(el);
      });
      row.appendChild(card);
    });
    pool.appendChild(row);
  });
}

function mkArr(c) {
  const a=document.createElement('div'); a.className='arr'; a.textContent=c; return a;
}

function renderBracket() {
  const bk=document.getElementById('bracket');
  if (!bk) return;
  bk.innerHTML='';

  const lh=document.createElement('div'); lh.className='bk-half';
  RL.forEach((r,i)=>{ if(i>0)lh.appendChild(mkArr('›')); lh.appendChild(makeRoundCol(r)); });
  bk.appendChild(lh);
  bk.appendChild(mkArr('›'));

  const cc=document.createElement('div'); cc.className='center-col';
  const finFilled=['fin-0','fin-1'].filter(k=>slots[k]).length;
  const fh=document.createElement('div'); fh.className='fin-title';
  fh.innerHTML=`🥈 决赛<sub>${finFilled}/2</sub>`;
  cc.appendChild(fh);
  const ci=document.createElement('div'); ci.className='center-inner';
  ci.appendChild(makeSlot('fin-0',false,'fin'));
  const cb=document.createElement('div'); cb.className='champ-block';
  const ct=document.createElement('div'); ct.className='champ-title';
  ct.innerHTML=`🏆 冠军<sub>${slots['champ-0']?1:0}/1</sub>`;
  cb.appendChild(ct); cb.appendChild(makeSlot('champ-0',true,'champ')); ci.appendChild(cb);
  ci.appendChild(makeSlot('fin-1',false,'fin'));
  cc.appendChild(ci); bk.appendChild(cc);
  bk.appendChild(mkArr('‹'));

  const rh=document.createElement('div'); rh.className='bk-half';
  RR.forEach((r,i)=>{ if(i>0)rh.appendChild(mkArr('‹')); rh.appendChild(makeRoundCol(r)); });
  bk.appendChild(rh);
}

function makeRoundCol(r) {
  const col=document.createElement('div'); col.className='round-col';
  const filled=Object.keys(slots).filter(k=>k.startsWith(r.id+'-')&&slots[k]).length;
  const hdr=document.createElement('div'); hdr.className='round-title';
  hdr.innerHTML=r.label+`<sub>${filled}/${r.count}</sub>`;
  col.appendChild(hdr);
  const grid=document.createElement('div');
  if (r.id==='r32L' || r.id==='r32R') {
    grid.className='sg';
    R32_MATCHES.filter(m=>m.rid===r.id).forEach(m=>{
      const pair=document.createElement('div'); pair.className='match-pair';
      pair.appendChild(makeSlot(`${r.id}-${m.ai}`,false,r.id));
      pair.appendChild(makeSlot(`${r.id}-${m.bi}`,false,r.id));
      grid.appendChild(pair);
    });
  } else {
    grid.className=r.cols>1?'sg2':'sg';
    for(let n=0;n<r.count;n++) grid.appendChild(makeSlot(`${r.id}-${n}`,false,r.id));
  }
  col.appendChild(grid); return col;
}

function makeSlot(sid,isChamp,rid) {
  const el=document.createElement('div');
  const tid=slots[sid];
  el.className='slot'+(tid?' filled':'')+(isChamp?' is-champ':'');
  if (tid) {
    const t=byId(tid);
    const inner=document.createElement('div'); inner.className='slot-team';
    inner.title=NEXT_LABEL[rid]?`点击 → ${t.name} 晋级${NEXT_LABEL[rid]}`:`🏆 ${t.name}`;
    inner.innerHTML=isChamp?`<span style="font-size:18px">${t.flag}</span><span>${t.name}</span>`:`<span>${t.flag}</span><span>${t.name}</span>`;
    inner.addEventListener('click',e=>{ e.stopPropagation(); advance(tid,rid); });
    const x=document.createElement('div'); x.className='slot-x'; x.textContent='✕'; x.title='移除';
    x.addEventListener('click',e=>{ e.stopPropagation(); delete slots[sid]; save(); renderBracket(); renderPool(); });
    el.appendChild(inner); el.appendChild(x);
  } else {
    el.innerHTML=`<div class="slot-empty">—</div>`;
  }
  return el;
}

function resetAll() {
  if (!confirm('确定要清除所有预测（含小组赛比分和淘汰赛）？')) return;
  slots={}; scores={};
  save(); saveScores();
  renderGroupStage();
  renderPool(); renderBracket();
  toast('已重置所有预测');
}

// ── Share / URL hash ──────────────────────────────────────
function encodeState() {
  return btoa(JSON.stringify({ s: scores, b: slots }));
}
function decodeState(h) {
  try { return JSON.parse(atob(h)); } catch { return null; }
}

let _sharedMode = false;

function shareLink() {
  const encoded = encodeState();

  // On a real public URL: copy hash link to clipboard
  const isPublic = location.protocol !== 'file:'
    && !['localhost','127.0.0.1','::1'].includes(location.hostname)
    && !location.hostname.endsWith('.local');

  if (isPublic) {
    const url = location.origin + location.pathname + '#' + encoded;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url)
        .then(() => toast('分享链接已复制！发给朋友即可查看你的预测'))
        .catch(() => prompt('复制此分享链接：', url));
    } else {
      prompt('复制此分享链接：', url);
    }
    return;
  }

  // Running locally: generate a self-contained HTML file with embedded data
  const doc = document.documentElement.cloneNode(true);
  // Clear dynamic containers — they'll be re-rendered from embedded data on load
  ['#groups-grid','#thirds-section','#bracket','#pool'].forEach(sel => {
    const el = doc.querySelector(sel); if (el) el.innerHTML = '';
  });
  doc.querySelector('#shared-banner').style.display = 'none';
  // Inject shared data as the very first script so it's available on boot
  const inject = document.createElement('script');
  inject.textContent = `window.__SHARED__='${encoded}';`;
  const mainScript = doc.querySelector('script');
  mainScript.parentNode.insertBefore(inject, mainScript);

  const blob = new Blob(['<!DOCTYPE html>\n' + doc.outerHTML], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'wc2026-prediction.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('已生成分享文件 📁 把 .html 文件发给朋友，浏览器打开即可查看');
}

function showSharedBanner() {
  _sharedMode = true;
  document.getElementById('shared-banner').style.display = 'flex';
}

function adoptShared() {
  save(); saveScores();
  _sharedMode = false;
  document.getElementById('shared-banner').style.display = 'none';
  history.replaceState(null, '', location.pathname);
  toast('已保存为我的预测！');
}

function clearShared() {
  loadScores(); load();
  _sharedMode = false;
  document.getElementById('shared-banner').style.display = 'none';
  history.replaceState(null, '', location.pathname);
  renderGroupStage();
  renderPool(); renderBracket();
}

function initFromHash() {
  // Check embedded data (from downloaded share file) or URL hash (from hosted share link)
  const encoded = window.__SHARED__ || location.hash.slice(1);
  if (!encoded) return;
  const data = decodeState(encoded);
  if (!data) return;
  scores = data.s || {};
  slots  = data.b || {};
  showSharedBanner();
}

// ── Boot ─────────────────────────────────────────────────
loadScores(); load();
initFromHash();   // overrides with shared state if URL hash present
renderGroupStage();
</script>
</body>
</html>
