<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 FIFA 世界杯预测</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#f0f4f8; --bg2:#ffffff; --bg3:#e8edf4;
  --gold:#d4890a; --text:#1a2636; --dim:#6b7c93;
  --bd:#c8d6e5; --bdhi:#9ab4cc;
  --green:#1e9e3a; --blue:#1a6abf; --purple:#6a3fbf;
}
body { font-family:'Segoe UI','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

header { background:var(--bg2); border-bottom:2px solid var(--gold); padding:9px 20px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.logo { font-size:20px; font-weight:800; color:var(--gold); }
.tagline { font-size:12px; color:var(--dim); margin-top:2px; }
.btn { padding:6px 14px; border:1px solid var(--gold); background:transparent; color:var(--gold); border-radius:5px; cursor:pointer; font-size:13px; font-family:inherit; transition:all .15s; font-weight:600; }
.btn:hover { background:var(--gold); color:#fff; }

.tabs { display:flex; background:var(--bg2); border-bottom:2px solid var(--bd); flex-shrink:0; }
.tab-btn { padding:9px 24px; background:transparent; color:var(--dim); border:none; border-bottom:2px solid transparent; margin-bottom:-2px; cursor:pointer; font-size:14px; font-family:inherit; transition:all .15s; font-weight:500; }
.tab-btn.active { color:var(--gold); border-bottom-color:var(--gold); font-weight:700; }
.tab-btn:hover:not(.active) { color:var(--text); background:var(--bg); }

#shared-banner { display:flex; align-items:center; justify-content:space-between; padding:8px 20px; background:#e8f5e9; border-bottom:1px solid #81c784; flex-shrink:0; gap:10px; font-size:13px; color:#2e7d32; }
.sbtn { padding:4px 12px; border:1px solid #4caf50; background:transparent; color:#2e7d32; border-radius:4px; cursor:pointer; font-size:12px; font-family:inherit; transition:all .15s; font-weight:600; }
.sbtn:hover { background:#4caf50; color:#fff; }
.sbtn-x { border-color:#adbfad; color:#6a7c6a; }
.sbtn-x:hover { background:#d4e8d4; color:#2e7d32; border-color:#4caf50; }

.tab-pane { flex:1; overflow:hidden; display:none; flex-direction:column; }
.tab-pane.active { display:flex; }

/* ══════════ GROUP STAGE ══════════ */
.gs-outer { flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 16px 60px; }
.groups-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-bottom:16px; }
.gs-card { background:var(--bg2); border:1px solid var(--bd); border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.gs-card-hdr { padding:6px 12px; font-size:13px; font-weight:700; }
.gs-card-hdr.left  { background:rgba(212,137,10,.1); color:var(--gold); border-bottom:1px solid rgba(212,137,10,.2); }
.gs-card-hdr.right { background:rgba(106,63,191,.1); color:var(--purple); border-bottom:1px solid rgba(106,63,191,.2); }
.gs-standings { padding:6px 10px 4px; }
.st-row { display:grid; grid-template-columns:16px 1fr 28px 22px 22px 22px 30px; align-items:center; font-size:12px; padding:3px 2px; border-radius:4px; gap:1px; }
.st-hdr { color:var(--dim); font-size:11px; margin-bottom:2px; }
.st-q1 { background:rgba(30,158,58,.14); }
.st-q2 { background:rgba(26,106,191,.12); }
.st-q3 { background:rgba(212,137,10,.12); }
.sn { text-align:center; color:var(--dim); }
.steam { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sv { text-align:center; color:var(--dim); }
.sp { font-weight:700; }
.sq1 { color:#1a7a2e; font-weight:700; }
.sq2 { color:#1452a0; font-weight:700; }
.sq3 { color:#b36a00; font-weight:700; }
.gs-matches { border-top:1px solid var(--bd); padding:6px 10px 8px; background:var(--bg); }
.gs-round-lbl { font-size:11px; color:var(--dim); padding:5px 0 3px; margin-top:3px; border-top:1px solid var(--bd); letter-spacing:.03em; font-weight:600; }
.gs-round-lbl:first-child { border-top:none; margin-top:0; padding-top:0; }
.gs-match { display:grid; grid-template-columns:1fr 34px 14px 34px 1fr; align-items:center; gap:4px; padding:3px 0; }
.gm-l { text-align:right; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.gm-r { text-align:left;  font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.gm-sep { text-align:center; color:var(--dim); font-size:13px; font-weight:700; }
.score-spin { width:32px; height:28px; border:1.5px solid var(--bd); border-radius:4px; background:var(--bg); color:var(--text); font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:ns-resize; user-select:none; flex-shrink:0; transition:border-color .12s; }
.score-spin:focus { border-color:var(--gold); background:#fffcf0; outline:none; }
.score-spin.empty { color:var(--bd); }
.score-spin.disabled { background:#f0f1f3; color:#adb5c0; border-color:var(--bd); cursor:default; pointer-events:none; }
.gs-match.done .score-spin { border-color:var(--bdhi); background:#f8f9fa; }

.thirds-card { background:var(--bg2); border:1px solid var(--bd); border-radius:8px; padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.thirds-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.thirds-title span { font-size:12px; font-weight:400; color:var(--dim); }
.thirds-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:5px; }
.third-row { display:flex; align-items:center; gap:7px; padding:5px 10px; border-radius:6px; background:var(--bg); border:1px solid var(--bd); font-size:12px; }
.third-row.adv { border-color:rgba(212,137,10,.5); background:rgba(212,137,10,.07); }
.third-row.adv .trn { color:var(--gold); }
.trn { font-weight:700; color:var(--dim); width:18px; text-align:center; flex-shrink:0; }
.trg { color:var(--dim); width:16px; text-align:center; flex-shrink:0; font-size:11px; font-weight:700; }
.trt { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trp { color:var(--dim); font-size:11px; white-space:nowrap; flex-shrink:0; }
.trbadge { background:var(--gold); color:#fff; padding:2px 7px; border-radius:3px; font-size:10px; font-weight:700; flex-shrink:0; }
.gs-legend { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; font-size:12px; color:var(--dim); }
.gs-legend span { display:flex; align-items:center; gap:5px; }
.ldot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }

/* ══════════ INLINE KNOCKOUT ══════════ */
.ko-wrap { margin-top:16px; }
.ko-divider { display:flex; align-items:center; gap:12px; padding:10px 14px; margin-bottom:10px; background:var(--bg2); border:1px solid rgba(212,137,10,.3); border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.06); flex-wrap:wrap; }
.ko-div-title { font-size:15px; font-weight:800; color:var(--gold); flex:1; }
.ko-div-hint { font-size:12px; color:var(--dim); }
.ko-rd { background:var(--bg2); border:1px solid var(--bd); border-radius:8px; margin-bottom:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.ko-rd-hdr { padding:6px 12px; display:flex; align-items:center; justify-content:space-between; background:rgba(212,137,10,.07); border-bottom:1px solid rgba(212,137,10,.18); }
.ko-rd-label { font-size:13px; font-weight:700; color:var(--gold); }
.ko-rd-count { font-size:11px; color:var(--dim); }
.ko-rd-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:5px; padding:8px; }
.ko-match { display:flex; flex-direction:column; gap:3px; padding:5px 8px; background:var(--bg); border:1px solid var(--bd); border-radius:6px; }
.ko-match.decided { border-color:var(--bdhi); }
.ko-match.tied { border-color:rgba(212,137,10,.45); background:rgba(212,137,10,.04); }
.ko-main { display:grid; grid-template-columns:1fr 34px 14px 34px 1fr; align-items:center; gap:4px; }
.ko-tl { text-align:right; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.ko-tr { text-align:left;  font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.ko-win { color:var(--green); font-weight:700; }
.ko-lose { opacity:.35; }
.ko-empty-team { color:var(--bd); font-size:11px; }
.ko-et { display:flex; align-items:center; gap:4px; padding:3px 6px; background:rgba(26,106,191,.08); border-radius:4px; border:1px solid rgba(26,106,191,.2); }
.ko-et-lbl { font-size:10px; font-weight:700; color:var(--blue); white-space:nowrap; flex-shrink:0; }
.ko-et-hint { font-size:10px; color:var(--dim); margin-left:4px; flex:1; }
.ko-pk { display:flex; align-items:center; gap:6px; padding:3px 6px; background:rgba(106,63,191,.08); border-radius:4px; border:1px solid rgba(106,63,191,.2); flex-wrap:wrap; }
.ko-pk-lbl { font-size:10px; font-weight:700; color:var(--purple); white-space:nowrap; flex-shrink:0; }
.pk-btn { padding:2px 10px; border-radius:4px; border:1px solid var(--bd); background:var(--bg2); cursor:pointer; font-size:11px; font-family:inherit; transition:all .12s; white-space:nowrap; }
.pk-btn:hover { border-color:var(--purple); background:rgba(106,63,191,.1); }
.pk-btn.chosen { background:rgba(106,63,191,.18); border-color:var(--purple); color:var(--purple); font-weight:700; }
.ko-champ { text-align:center; padding:20px 0 10px; }
.ko-champ-box { display:inline-flex; align-items:center; gap:12px; padding:12px 32px; background:rgba(212,137,10,.1); border:2px solid var(--gold); border-radius:12px; font-size:18px; font-weight:800; color:var(--gold); }
.ko-champ-empty { font-size:14px; color:var(--dim); padding:10px 24px; border:1px dashed var(--bd); border-radius:8px; display:inline-block; }

/* ══════════ GROUP SEEDING PANEL ══════════ */
.gs-seed { background:var(--bg2); border:1px solid var(--bd); border-radius:8px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden; }
.gs-seed-hdr { display:flex; align-items:center; gap:8px; padding:7px 14px; background:rgba(26,106,191,.07); border-bottom:1px solid rgba(26,106,191,.2); }
.gs-seed-title { font-size:14px; font-weight:800; color:var(--blue); flex:1; }
.gs-seed-hint { font-size:11px; color:var(--dim); }
.gs-seed-body { padding:8px 10px 10px; }
.gs-seed-body.collapsed { display:none; }
.gs-seed-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(188px,1fr)); gap:7px; }
.gs-seed-card { border:1px solid var(--bd); border-radius:6px; overflow:hidden; }
.gs-seed-card-hdr { padding:4px 10px; font-size:12px; font-weight:700; color:var(--gold); background:rgba(212,137,10,.08); display:flex; align-items:center; gap:4px; }
.gs-seed-sels { margin-left:auto; display:flex; gap:4px; font-size:11px; }
.gs-seed-sel1 { color:var(--green); font-weight:700; }
.gs-seed-sel2 { color:var(--blue); font-weight:700; }
.gs-seed-teams { display:flex; flex-direction:column; gap:2px; padding:5px 6px; }
.gs-team-btn { display:flex; align-items:center; gap:5px; padding:4px 7px; border-radius:4px; border:1px solid var(--bd); background:var(--bg); cursor:pointer; font-size:11px; font-family:inherit; text-align:left; transition:all .1s; width:100%; }
.gs-team-btn:hover:not(.rank1):not(.rank2) { border-color:var(--gold); background:rgba(212,137,10,.08); }
.gs-team-btn.rank1 { border-color:var(--green); background:rgba(30,158,58,.1); color:var(--green); font-weight:700; }
.gs-team-btn.rank2 { border-color:var(--blue); background:rgba(26,106,191,.1); color:var(--blue); font-weight:700; }
.gs-team-btn.rank3 { border-color:var(--gold); background:rgba(212,137,10,.1); color:#b56a00; font-weight:700; }
.gs-team-btn.rank1:hover,.gs-team-btn.rank2:hover,.gs-team-btn.rank3:hover { opacity:.75; }
.gs-rank-badge { margin-left:auto; font-size:10px; font-weight:700; flex-shrink:0; }
.gs-seed-sel3 { color:var(--gold); font-weight:700; }

/* ══════════ BRACKET ══════════ */
.bracket-outer { flex:1; overflow-y:auto; overflow-x:hidden; padding:10px 14px 40px; }
.bracket-hint { padding:6px 12px; font-size:12px; color:var(--dim); background:var(--bg2); border-bottom:1px solid var(--bd); flex-shrink:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.bracket-hint strong { color:var(--gold); }
/* Unified bracket container */
.bracket-unified { overflow-x:auto; padding:8px 4px 12px; }
/* Horizontal rounds row */
.half-rounds { display:flex; align-items:stretch; min-height:420px; position:relative; }
/* Final column */
.round-col-fin { display:flex; flex-direction:column; align-items:center; width:140px; }
.round-col-fin .sg { flex:1; display:flex; flex-direction:column; justify-content:center; width:100%; }
.round-col-fin-champ { display:flex; flex-direction:column; align-items:center; gap:4px; margin-top:8px; width:100%; }
/* Round column */
.round-col { display:flex; flex-direction:column; flex-shrink:0; width:126px; }
.round-title { text-align:center; font-size:11px; font-weight:700; color:var(--gold); padding:3px 6px; background:rgba(212,137,10,.08); border:1px solid rgba(212,137,10,.3); border-radius:5px; margin-bottom:4px; white-space:nowrap; flex-shrink:0; }
.sg { flex:1; display:flex; flex-direction:column; justify-content:space-around; gap:2px; }
/* Connector column */
.bk-conn { flex-shrink:0; width:20px; position:relative; }
/* Match pair */
.match-pair { display:flex; flex-direction:column; border:1.5px solid var(--bd); border-radius:6px; overflow:hidden; background:var(--bg); }
.match-pair.decided { border-color:var(--bdhi); }
.mp-team { display:flex; align-items:center; gap:4px; padding:3px 6px; height:28px; min-width:0; transition:background .12s; }
.mp-team.filled { background:var(--bg2); }
.mp-team.winner { background:rgba(30,158,58,.13); }
.mp-team.winner .mp-name { color:var(--green); font-weight:700; }
.mp-team.loser { opacity:.32; }
.mp-team.clickable { cursor:pointer; }
.mp-team.clickable:hover { background:rgba(212,137,10,.11); }
.mp-team.picked { background:rgba(212,137,10,.07); }
.mp-team + .mp-team { border-top:1px solid var(--bg3); }
.mp-flag { font-size:11px; flex-shrink:0; }
.mp-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); font-size:11px; }
.mp-empty { width:100%; text-align:center; font-size:10px; color:var(--bd); padding:4px 0; }
.mp-src { font-size:9px; color:var(--dim); flex-shrink:0; }
/* R32 team selector */
.r32-placeholder { flex:1; color:var(--dim); font-size:10px; font-style:italic; padding:0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.slot-clear-btn { font-size:9px; padding:0 3px; border:none; background:none; color:var(--dim); cursor:pointer; line-height:1; flex-shrink:0; }
.slot-clear-btn:hover { color:var(--text); }
/* Champion */
.champ-block { display:flex; flex-direction:column; align-items:center; gap:6px; }
.champ-title { text-align:center; font-size:13px; font-weight:700; color:var(--gold); padding:5px 12px; background:rgba(212,137,10,.1); border:1.5px solid var(--gold); border-radius:6px; white-space:nowrap; }
.slot-champ { width:120px; min-height:56px; border:2px solid var(--gold); border-radius:8px; background:#fffbf0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2px; padding:6px; text-align:center; }
.slot-champ .c-flag { font-size:20px; }
.slot-champ .c-name { font-size:12px; font-weight:700; color:var(--gold); }
.slot-champ .c-empty { font-size:11px; color:rgba(212,137,10,.45); }
.slot-champ .c-empty { font-size:11px; color:rgba(212,137,10,.45); }

/* Toast */
#toast { position:fixed; bottom:24px; right:24px; background:var(--text); border:1px solid var(--gold); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none; z-index:100; box-shadow:0 4px 12px rgba(0,0,0,.15); }
#toast.on { opacity:1; transform:none; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--bd); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--bdhi); }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">⚽ 2026 FIFA 世界杯 — 比分预测</div>
    <div class="tagline">预测小组赛 + 淘汰赛所有比分，自动计算晋级；或在夺冠之路手动输入</div>
  </div>
  <div style="display:flex;gap:6px">
    <button class="btn" onclick="shareLink()">📤 分享</button>
    <button class="btn" onclick="resetAll()">🔄 重置</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" id="tbp" onclick="switchTab('predict')">📋 比分预测</button>
  <button class="tab-btn"        id="tbk" onclick="switchTab('knockout')">🏆 夺冠之路</button>
</nav>

<div id="shared-banner" style="display:none">
  <span>📤 正在查看分享的预测（只读）</span>
  <div style="display:flex;gap:6px">
    <button class="sbtn" onclick="adoptShared()">💾 保存为我的预测</button>
    <button class="sbtn sbtn-x" onclick="clearShared()">✕ 关闭</button>
  </div>
</div>

<!-- ── TAB 1: 比分预测 ── -->
<div id="pane-predict" class="tab-pane active">
  <div class="gs-outer">
    <div class="gs-legend">
      <span><span class="ldot" style="background:#3ecf5e"></span>直接晋级（1、2名）</span>
      <span><span class="ldot" style="background:#f5a623"></span>可能晋级（第3名）</span>
      <span><span class="ldot" style="background:#2e4464"></span>淘汰</span>
    </div>
    <div id="groups-grid" class="groups-grid"></div>
    <div id="thirds-section" class="thirds-card"></div>
    <div class="ko-wrap">
      <div class="ko-divider">
        <div class="ko-div-title">🏆 淘汰赛比分预测</div>
        <span class="ko-div-hint">填完小组赛后点击生成</span>
        <button class="btn" onclick="generateKO()" style="padding:4px 14px;font-size:12px">⚡ 生成32强对阵</button>
      </div>
      <div id="ko-rounds"></div>
    </div>
  </div>
</div>

<!-- ── TAB 2: 夺冠之路 (X bracket) ── -->
<div id="pane-knockout" class="tab-pane">
  <div class="bracket-hint">
    <strong>🏆 夺冠之路</strong>
    <span style="color:#aaa">·</span>
    <span>点击队伍手动选择晋级 · 分组面板选队进入32强 · ✕取消 · 绿色=已晋级</span>
    <button class="btn" onclick="generateKO();renderBracket()" style="padding:3px 10px;font-size:11px;margin-left:auto">⚡ 从比分预测更新</button>
  </div>
  <div class="bracket-outer">
    <div id="bracket" class="bracket-wrap"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Data ─────────────────────────────────────────────────
const GROUPS = [
  { name:'A', left:true, teams:[
    {id:'mx',name:'墨西哥',    flag:'🇲🇽',conf:'CONCACAF',host:true},
    {id:'za',name:'南非',      flag:'🇿🇦',conf:'CAF'},
    {id:'kr',name:'韩国',      flag:'🇰🇷',conf:'AFC'},
    {id:'cz',name:'捷克',      flag:'🇨🇿',conf:'UEFA'},
  ]},
  { name:'B', left:true, teams:[
    {id:'ca',name:'加拿大',    flag:'🇨🇦',conf:'CONCACAF',host:true},
    {id:'ba',name:'波黑',      flag:'🇧🇦',conf:'UEFA'},
    {id:'qa',name:'卡塔尔',    flag:'🇶🇦',conf:'AFC'},
    {id:'ch',name:'瑞士',      flag:'🇨🇭',conf:'UEFA'},
  ]},
  { name:'C', left:true, teams:[
    {id:'br',name:'巴西',      flag:'🇧🇷',conf:'CONMEBOL'},
    {id:'ma',name:'摩洛哥',    flag:'🇲🇦',conf:'CAF'},
    {id:'ht',name:'海地',      flag:'🇭🇹',conf:'CONCACAF'},
    {id:'sc',name:'苏格兰',    flag:'🏴󠁧󠁢󠁳󠁣󠁴󠁿',conf:'UEFA'},
  ]},
  { name:'D', left:true, teams:[
    {id:'us',name:'美国',      flag:'🇺🇸',conf:'CONCACAF',host:true},

function getStandings(grpName) {
  const g=GROUPS.find(x=>x.name===grpName);
  const st=g.teams.map(t=>({...t,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}));
  PAIRS.forEach(([i,j],mi)=>{
    const s=scores[`${grpName}-${mi}`];
    if(!s||s.h==null||s.a==null)return;
    const h=+s.h,a=+s.a;
    st[i].p++;st[j].p++;st[i].gf+=h;st[i].ga+=a;st[j].gf+=a;st[j].ga+=h;
    if(h>a){st[i].w++;st[i].pts+=3;st[j].l++;}
    else if(h<a){st[j].w++;st[j].pts+=3;st[i].l++;}
    else{st[i].d++;st[i].pts++;st[j].d++;st[j].pts++;}
  });
  st.forEach(t=>t.gd=t.gf-t.ga);
  return [...st].sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}

function buildStandingsHTML(st) {
  const qcls=['sq1 st-q1','sq2 st-q2','sq3 st-q3',''];
  return `<div class="st-row st-hdr"><span class="sn">#</span><span class="steam">球队</span><span class="sv">积</span><span class="sv">W</span><span class="sv">D</span><span class="sv">L</span><span class="sv">净</span></div>`
    +st.map((t,r)=>{const gd=t.gd>0?'+'+t.gd:t.gd;return`<div class="st-row ${qcls[r]}"><span class="sn">${r+1}</span><span class="steam">${t.flag} ${t.name}</span><span class="sv sp">${t.pts}</span><span class="sv">${t.w}</span><span class="sv">${t.d}</span><span class="sv">${t.l}</span><span class="sv">${gd}</span></div>`;}).join('');
}

function getAllThirds() {
  return GROUPS.map(g=>{const st=getStandings(g.name);return{...st[2],srcGroup:g.name};})
    .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}

function makeScoreSpin(initVal,disabled,onChange){
  const el=document.createElement('div');
  el.className='score-spin'+(disabled?' disabled':'')+(initVal==null?' empty':'');
  if(!disabled)el.tabIndex=0;
  el.textContent=initVal!=null?String(initVal):'?';
  if(disabled)return el;
  const set=(n)=>{el.textContent=String(n);el.classList.remove('empty');onChange(n);};
  const clr=()=>{el.textContent='?';el.classList.add('empty');onChange(null);};
  el.addEventListener('wheel',(e)=>{
    e.preventDefault();
    const cur=el.classList.contains('empty')?0:parseInt(el.textContent);
    set(Math.min(9,Math.max(0,cur+(e.deltaY<0?1:-1))));
  },{passive:false});
  el.addEventListener('keydown',(e)=>{
    if(e.key>='0'&&e.key<='9'){e.preventDefault();set(parseInt(e.key));}
    else if(e.key==='ArrowUp'){e.preventDefault();set(Math.min(9,(el.classList.contains('empty')?-1:parseInt(el.textContent))+1));}
    else if(e.key==='ArrowDown'){e.preventDefault();set(Math.max(0,(el.classList.contains('empty')?1:parseInt(el.textContent))-1));}
    else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();clr();}
  });
  el.addEventListener('click',()=>el.focus());
  return el;
}

// Returns {winId, source} — kscores take priority, then picks
// kscores fields: a, b (RT scores), eta, etb (ET additional goals), pk (penalty winner id)
function getKOWinner(rid, mi) {
  const sidA=`${rid}-${mi*2}`, sidB=`${rid}-${mi*2+1}`;
  const tA=slots[sidA], tB=slots[sidB];
  if(!tA||!tB) return {winId:null,source:null};
  const ks=kscores[`${rid}-m${mi}`]||{};
  if(ks.a!=null&&ks.b!=null){
    const sa=+ks.a, sb=+ks.b;
    if(sa!==sb) return {winId:sa>sb?tA:tB, source:'score'};
    // Regular time draw — check extra time
    if(ks.eta!=null&&ks.etb!=null){
      const ea=sa+ +ks.eta, eb=sb+ +ks.etb;
      if(ea!==eb) return {winId:ea>eb?tA:tB, source:'score'};
      // ET also drawn — check penalty shootout
      const pkId=ks.pk;
      if(pkId===tA||pkId===tB) return {winId:pkId, source:'score'};
    }
  }
  const pk=picks[`${rid}-m${mi}`];
  if(pk===tA||pk===tB) return {winId:pk, source:'pick'};
  return {winId:null, source:null};
}

function recomputeKO() {
  const chain=[
    {from:'r32L',to:'r16L',n:8},{from:'r32R',to:'r16R',n:8},
    {from:'r16L',to:'qfL', n:4},{from:'r16R',to:'qfR', n:4},
    {from:'qfL', to:'sfL', n:2},{from:'qfR', to:'sfR', n:2},
    {from:'sfL', n:1,gt:()=>'fin-0'},{from:'sfR',n:1,gt:()=>'fin-1'},
    {from:'fin', n:1,gt:()=>'champ-0'},
  ];
  chain.forEach(({from,to,n,gt})=>{
    for(let mi=0;mi<n;mi++){
      const dst=gt?gt():`${to}-${mi}`;
      const {winId}=getKOWinner(from,mi);
      if(winId) slots[dst]=winId; else delete slots[dst];
    }
  });
  save(); renderInlineKO();
  if(document.getElementById('pane-knockout').classList.contains('active')) renderBracket();
}

function makeKOMatch(rid,mi) {
  const sidA=`${rid}-${mi*2}`,sidB=`${rid}-${mi*2+1}`;
  const tA=slots[sidA]?byId(slots[sidA]):null;
  const tB=slots[sidB]?byId(slots[sidB]):null;
  const mkey=`${rid}-m${mi}`,ks=kscores[mkey]||{};
  const hasRT=ks.a!=null&&ks.b!=null;

  // Determine result stage
  let rtDraw=false,etDraw=false,winTeam=null;
  if(hasRT&&tA&&tB){
    const sa=+ks.a,sb=+ks.b;
    if(sa>sb) winTeam=tA;
    else if(sb>sa) winTeam=tB;
    else {
      rtDraw=true;
      if(ks.eta!=null&&ks.etb!=null){
        const ea=sa+ +ks.eta,eb=sb+ +ks.etb;
        if(ea>eb) winTeam=tA;
        else if(eb>ea) winTeam=tB;
        else {
          etDraw=true;
          if(ks.pk===tA.id) winTeam=tA;
          else if(ks.pk===tB.id) winTeam=tB;
        }
      }
    }
  }

  const wrap=document.createElement('div');
  wrap.className='ko-match'+(winTeam?' decided':rtDraw?' tied':'');

  // updateETVis is assigned after etDiv/pkDiv are created (closure captures the let binding)
  let updateETVis=()=>{};

  const onRT=(side,v)=>{
    if(!kscores[mkey])kscores[mkey]={};
    kscores[mkey][side]=v;
    if(kscores[mkey].a==null&&kscores[mkey].b==null)delete kscores[mkey];
    else{delete kscores[mkey].eta;delete kscores[mkey].etb;delete kscores[mkey].pk;}
    saveKScores();updateETVis();scheduleRecomputeKO();
  };
  const onET=(side,v)=>{
    if(!kscores[mkey])kscores[mkey]={};
    kscores[mkey][side]=v;
    delete kscores[mkey].pk;
    saveKScores();updateETVis();scheduleRecomputeKO();
  };

  // ── Main row ──────────────────────────────────────────────
  const main=document.createElement('div');main.className='ko-main';
  const lSpan=document.createElement('span');
  lSpan.className='ko-tl'+(winTeam===tA?' ko-win':winTeam===tB?' ko-lose':'');
  if(tA) lSpan.textContent=`${tA.flag} ${tA.name}`;
  else   lSpan.innerHTML='<span class="ko-empty-team">—</span>';
  const spinA=makeScoreSpin(ks.a??null,!tA||!tB,v=>onRT('a',v));
  const sep=document.createElement('span');sep.className='gm-sep';sep.textContent=':';
  const spinB=makeScoreSpin(ks.b??null,!tA||!tB,v=>onRT('b',v));
  const rSpan=document.createElement('span');
  rSpan.className='ko-tr'+(winTeam===tB?' ko-win':winTeam===tA?' ko-lose':'');
  if(tB) rSpan.textContent=`${tB.name} ${tB.flag}`;
  else   rSpan.innerHTML='<span class="ko-empty-team">—</span>';
  main.appendChild(lSpan);main.appendChild(spinA);main.appendChild(sep);main.appendChild(spinB);main.appendChild(rSpan);
  wrap.appendChild(main);

  // ── Extra Time row (shown when RT is draw) ─────────────────
  const etDiv=document.createElement('div');
  etDiv.className='ko-et';etDiv.style.display=rtDraw?'flex':'none';
  const etLbl=document.createElement('span');etLbl.className='ko-et-lbl';etLbl.textContent='加时赛:';
  const etSpinA=makeScoreSpin(ks.eta??null,!tA||!tB,v=>onET('eta',v));
  const etSep=document.createElement('span');etSep.className='gm-sep';etSep.style.fontSize='11px';etSep.textContent=':';
  const etSpinB=makeScoreSpin(ks.etb??null,!tA||!tB,v=>onET('etb',v));
  const etHint=document.createElement('span');etHint.className='ko-et-hint';
  etHint.textContent=winTeam&&!etDraw?`→ ${winTeam.name} 加时晋级`:etDraw?'→ 点球大战':'请填写加时赛比分';
  etDiv.appendChild(etLbl);etDiv.appendChild(etSpinA);etDiv.appendChild(etSep);etDiv.appendChild(etSpinB);etDiv.appendChild(etHint);
  wrap.appendChild(etDiv);

  // ── Penalty row (shown when ET is also draw) ───────────────
  const pkDiv=document.createElement('div');
  pkDiv.className='ko-pk';pkDiv.style.display=etDraw?'flex':'none';
  const pkLbl=document.createElement('span');pkLbl.className='ko-pk-lbl';pkLbl.textContent='点球大战:';
  pkDiv.appendChild(pkLbl);
  if(tA&&tB){
    const mkPkBtn=(team)=>{
      const btn=document.createElement('button');
      btn.className='pk-btn'+(ks.pk===team.id?' chosen':'');
      btn.textContent=`${team.flag} ${team.name}`;
      btn.addEventListener('click',()=>{
        if(!kscores[mkey])kscores[mkey]={};
        kscores[mkey].pk=(kscores[mkey].pk===team.id)?null:team.id;
        saveKScores();recomputeKO();
        if(kscores[mkey]?.pk===team.id) toast(`${team.name} 点球晋级！`);
      });
      return btn;
    };
    const vsSep=document.createElement('span');vsSep.style.cssText='font-size:11px;color:var(--dim);';vsSep.textContent='vs';
    pkDiv.appendChild(mkPkBtn(tA));pkDiv.appendChild(vsSep);pkDiv.appendChild(mkPkBtn(tB));
  }
  wrap.appendChild(pkDiv);

  // Assign real updateETVis after all elements exist
  updateETVis=()=>{
    const k=kscores[mkey]||{};
    const isRTD=k.a!=null&&k.b!=null&&+k.a===+k.b;
    const isETD=isRTD&&k.eta!=null&&k.etb!=null&&(+k.a+(+k.eta||0))===(+k.b+(+k.etb||0));
    etDiv.style.display=isRTD?'flex':'none';
    pkDiv.style.display=isETD?'flex':'none';
    if(isRTD&&!isETD&&k.eta!=null&&k.etb!=null){
      const wt=+k.a+ +k.eta>+k.b+ +k.etb?tA:tB;
      etHint.textContent=wt?`→ ${wt.name} 加时晋级`:'';
    }else if(isETD){etHint.textContent='→ 点球大战';}
    else{etHint.textContent='请填写加时赛比分';}
  };

  return wrap;
}

function renderInlineKO() {
  const container=document.getElementById('ko-rounds');if(!container)return;
  container.innerHTML='';
  KO_ROUNDS.forEach(round=>{
    let total=0,filled=0;const matchEls=[];
    round.parts.forEach(({rid,n})=>{
      for(let mi=0;mi<n;mi++){
        total++;
        const sidA=`${rid}-${mi*2}`,sidB=`${rid}-${mi*2+1}`;
        if(slots[sidA]&&slots[sidB])filled++;
        matchEls.push(makeKOMatch(rid,mi));
      }
    });
    const rd=document.createElement('div');rd.className='ko-rd';
    const hdr=document.createElement('div');hdr.className='ko-rd-hdr';
    const lbl=document.createElement('span');lbl.className='ko-rd-label';lbl.textContent=round.label;
    const cnt=document.createElement('span');cnt.className='ko-rd-count';cnt.textContent=`${filled}/${total} 已填`;
    hdr.appendChild(lbl);hdr.appendChild(cnt);rd.appendChild(hdr);
    const grid=document.createElement('div');grid.className='ko-rd-grid';
    matchEls.forEach(el=>grid.appendChild(el));
    rd.appendChild(grid);container.appendChild(rd);
  });
  const champTid=slots['champ-0'],ct=champTid?byId(champTid):null;
  const champDiv=document.createElement('div');champDiv.className='ko-champ';
  champDiv.innerHTML=ct
    ?`<div class="ko-champ-box"><span style="font-size:24px">${ct.flag}</span><span>🏆 世界杯冠军：${ct.name}</span></div>`
    :`<div class="ko-champ-empty">🏆 冠军待定</div>`;
  container.appendChild(champDiv);
}

function generateKO() {
  const st={};GROUPS.forEach(g=>{st[g.name]=getStandings(g.name);});
  const allThirds=GROUPS.map(g=>({...st[g.name][2],srcGroup:g.name})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  const top8=allThirds.slice(0,8);
  const thirdSlots=R32_MATCHES.filter(m=>m.tb.rank===3)
    .map(m=>({sid:`${m.rid}-${m.bi}`,eligible:top8.filter(t=>m.tb.el.includes(t.srcGroup))}))
    .sort((a,b)=>a.eligible.length-b.eligible.length);
  const used=new Set(),thirds={};
  thirdSlots.forEach(({sid,eligible})=>{for(const t of eligible){if(!used.has(t.id)){thirds[sid]=t.id;used.add(t.id);break;}}});
  const newSlots={};
  R32_MATCHES.forEach(m=>{
    const sidA=`${m.rid}-${m.ai}`,sidB=`${m.rid}-${m.bi}`;
    const tA=st[m.ta.grp][m.ta.rank-1];if(tA)newSlots[sidA]=tA.id;
    if(m.tb.rank<=2){const tB=st[m.tb.grp][m.tb.rank-1];if(tB)newSlots[sidB]=tB.id;}
    else if(thirds[sidB])newSlots[sidB]=thirds[sidB];
  });
  slots=newSlots;kscores={};picks={};
  save();saveKScores();savePicks();
  recomputeKO();
  toast('32强对阵已生成！');
}

// ══════════ 夺冠之路 (top/bottom halves) ══════════

// Returns the slot ID for a group's 1st or 2nd place in R32
function getGroupSlot(grp, rank) {
  for(const m of R32_MATCHES){
    if(m.ta.rank===rank&&m.ta.grp===grp) return `${m.rid}-${m.ai}`;
    if(m.tb.rank===rank&&m.tb.grp===grp) return `${m.rid}-${m.bi}`;
  }
  return null;
}

// Returns {s1, s2, r1Id, r2Id} — current 1st/2nd slot IDs and team IDs for a group
function getGroupSeeds(grp) {
  const s1=getGroupSlot(grp,1), s2=getGroupSlot(grp,2);
  return {s1, s2, r1Id:s1?slots[s1]:null, r2Id:s2?slots[s2]:null};
}

function teamGroup(teamId){
  return GROUPS.find(g=>g.teams.some(t=>t.id===teamId))?.name||null;
}

// Find the 3rd-place R32 slot currently occupied by a team from group grp
function getThirdSlotFor(grp){
  for(const m of R32_MATCHES){
    if(m.tb.rank===3&&m.tb.el&&m.tb.el.includes(grp)){
      const sid=`${m.rid}-${m.bi}`;
      if(slots[sid]&&teamGroup(slots[sid])===grp) return sid;
    }
  }
  return null;
}

// Find an empty 3rd-place slot whose el list includes grp
function findEmptyThirdSlot(grp){
  for(const m of R32_MATCHES){
    if(m.tb.rank===3&&m.tb.el&&m.tb.el.includes(grp)){
      const sid=`${m.rid}-${m.bi}`;
      if(!slots[sid]) return sid;
    }
  }
  return null;
}

// Called when user clicks a team in the group seeding panel
function clickGroupTeam(grp, teamId) {
  const {s1,s2,r1Id,r2Id}=getGroupSeeds(grp);
  const thirdSid=getThirdSlotFor(grp);
  const r3Id=thirdSid?slots[thirdSid]:null;
  if(r1Id===teamId){ if(s1)delete slots[s1]; }
  else if(r2Id===teamId){ if(s2)delete slots[s2]; }
  else if(r3Id===teamId){ delete slots[thirdSid]; }
  else if(!r1Id&&s1){ slots[s1]=teamId; toast(`${byId(teamId)?.name} → ${grp}组 第1名`); }
  else if(!r2Id&&s2){ slots[s2]=teamId; toast(`${byId(teamId)?.name} → ${grp}组 第2名`); }
  else {
    // Assign as 3rd-place qualifier
    if(thirdSid){
      slots[thirdSid]=teamId;
      toast(`${byId(teamId)?.name} → ${grp}组 第3名晋级`);
    } else {
      const emptySid=findEmptyThirdSlot(grp);
      if(emptySid){ slots[emptySid]=teamId; toast(`${byId(teamId)?.name} → ${grp}组 第3名晋级`); }
      else { toast('第3名席位已满（8个），取消其他第3名后再试'); return; }
    }
  }
  save(); recomputeKO();
  if(document.getElementById('pane-knockout').classList.contains('active')) renderBracket();
}

function makeGroupSeedCard(g) {
  const {s1,s2,r1Id,r2Id}=getGroupSeeds(g.name);

  const r3Id=thirdSid?slots[thirdSid]:null;

  const card=document.createElement('div');card.className='gs-seed-card';

  if(r2){const s=document.createElement('span');s.className='gs-seed-sel2';s.textContent=`${r2.flag}2`;sels.appendChild(s);}

  g.teams.forEach(t=>{

    const btn=document.createElement('button');
    btn.className='gs-team-btn'+(isR1?' rank1':isR2?' rank2':isR3?' rank3':'');

function renderBracket(){
  const bk=document.getElementById('bracket');if(!bk)return;
  bk.innerHTML='';bk.className='';bk.style.cssText='';
  bk.appendChild(makeGroupSeedPanel());

  const wrap=document.createElement('div');wrap.className='bracket-unified';
  const hr=document.createElement('div');hr.className='half-rounds';

  // Left side: r32L → r16L → qfL → sfL (converging toward center)
  RL.forEach((r,i)=>{
    if(i>0)hr.appendChild(makeConnector(RL[i-1].n,r.n,'right'));
    hr.appendChild(makeRoundCol(r));
  });

  // Center: final match
  hr.appendChild(makeConnector(1,1,'right1'));
  hr.appendChild(makeFinalCol());
  hr.appendChild(makeConnector(1,1,'left1'));

  // Right side: sfR → qfR → r16R → r32R (expanding from center)
  RR.forEach((r,i)=>{
    if(i>0)hr.appendChild(makeConnector(RR[i-1].n,r.n,'left'));
    hr.appendChild(makeRoundCol(r));
  });

  wrap.appendChild(hr);
  bk.appendChild(wrap);

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(hr)drawBracketLines(hr);
  }));
}

function makeRoundCol(r) {
  const col=document.createElement('div');col.className='round-col';
  const ttl=document.createElement('div');ttl.className='round-title';ttl.textContent=r.label;
  col.appendChild(ttl);
  const sg=document.createElement('div');sg.className='sg';
  const isR32=(r.id==='r32L'||r.id==='r32R');

  for(let mi=0;mi<r.n;mi++){
    const aiIdx=isR32?matches[mi].ai:mi*2;
    const biIdx=isR32?matches[mi].bi:mi*2+1;
    sg.appendChild(makeBracketPair(r.id,mi,aiIdx,biIdx,isR32));

  col.appendChild(sg);return col;
}

function makeConnector(nFrom,nTo,side='right'){
  const div=document.createElement('div');div.className='bk-conn';
  div.dataset.from=nFrom;div.dataset.to=nTo;div.dataset.side=side;
  return div;
}

function makeBracketPair(rid,mi,aiIdx,biIdx,isR32=false) {
  const sidA=`${rid}-${aiIdx}`,sidB=`${rid}-${biIdx}`;
  const tA=slots[sidA]?byId(slots[sidA]):null;
  const tB=slots[sidB]?byId(slots[sidB]):null;
  const mkey=`${rid}-m${mi}`;
  const {winId,source}=getKOWinner(rid,mi);
  const isScoreLocked=source==='score'&&winId!=null;

  const pair=document.createElement('div');
  pair.className='match-pair'+(winId?' decided':'');

  const makeRow=(sid,t)=>{
    const isWinner=!!(winId&&t&&t.id===winId);
    const isLoser=!!(winId&&t&&t.id!==winId);
    const canClick=!!(tA&&tB&&t&&!isScoreLocked);
    const isPick=!isScoreLocked&&t&&picks[mkey]===t.id&&!isWinner;

    const row=document.createElement('div');
    row.className='mp-team'+(t?' filled':'')+(isWinner?' winner':'')+(isLoser?' loser':'')+(isPick?' picked':'')+(canClick?' clickable':'');

    if(t){
      const flag=document.createElement('span');flag.className='mp-flag';flag.textContent=t.flag;
      const name=document.createElement('span');name.className='mp-name';name.textContent=t.name;
      row.appendChild(flag);row.appendChild(name);
      if(isWinner){const src=document.createElement('span');src.className='mp-src';src.textContent=source==='score'?'⚽':'👆';row.appendChild(src);}
      if(isR32){
        // Allow changing R32 slot assignment
        const clr=document.createElement('button');clr.className='slot-clear-btn';clr.textContent='✕';clr.title='更换球队';
        clr.addEventListener('click',e=>{
          e.stopPropagation();
          delete slots[sid];delete picks[mkey];delete kscores[mkey];
          save();savePicks();saveKScores();recomputeKO();
          if(document.getElementById('pane-knockout').classList.contains('active'))renderBracket();
        });
        row.appendChild(clr);
      }
      if(canClick){
        row.title=isWinner&&source==='pick'?'取消选择':`选 ${t.name} 晋级`;
        row.addEventListener('click',()=>{
          if(picks[mkey]===t.id)delete picks[mkey]; else picks[mkey]=t.id;
          savePicks();recomputeKO();
          if(picks[mkey]===t.id)toast(`${t.name} 手动晋级！`);
        });
      }
    } else if(isR32){
      // Empty R32 slot — show seed label from R32_MATCHES (use group panel to fill)
      const idx=parseInt(sid.split('-').pop());
      const rm=R32_MATCHES.find(m=>m.rid===rid&&(m.ai===idx||m.bi===idx));
      const info=rm?(rm.ai===idx?rm.ta:rm.tb):null;
      const label=info?(info.rank===3?`第3名 (${info.el.join('')})`:`${info.grp}组 第${info.rank}名`):'—';
      const ph=document.createElement('span');ph.className='r32-placeholder';ph.textContent=label;
      row.appendChild(ph);
    } else {
      const e=document.createElement('div');e.className='mp-empty';e.textContent='—';row.appendChild(e);
    }
    return row;
  };

  pair.appendChild(makeRow(sidA,tA));
  pair.appendChild(makeRow(sidB,tB));
  return pair;
}

function makeChampSlot(){
  const el=document.createElement('div');el.className='slot-champ';
  const tid=slots['champ-0'];
  if(tid){const t=byId(tid);el.innerHTML=`<span class="c-flag">${t.flag}</span><span class="c-name">${t.name}</span>`;}
  else el.innerHTML='<span class="c-empty">🏆 待定</span>';
  return el;
}

// Draw SVG connector lines between round columns
function drawBracketLines(bk) {
  const existing=bk.querySelector('.bk-svg');if(existing)existing.remove();
  const bkRect=bk.getBoundingClientRect();
  const W=bk.scrollWidth||bk.offsetWidth, H=bk.scrollHeight||bk.offsetHeight;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.classList.add('bk-svg');
  svg.style.cssText=`position:absolute;top:0;left:0;width:${W}px;height:${H}px;pointer-events:none;overflow:visible;z-index:0;`;

  const LINE='#9ab4cc',LW=1.5;
  const cx=(x)=>x-bkRect.left, cy=(y)=>y-bkRect.top;

  function line(x1,y1,x2,y2){
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',cx(x1));l.setAttribute('y1',cy(y1));
    l.setAttribute('x2',cx(x2));l.setAttribute('y2',cy(y2));
    l.setAttribute('stroke',LINE);l.setAttribute('stroke-width',LW);
    l.setAttribute('stroke-linecap','round');
    svg.appendChild(l);
  }

  bk.querySelectorAll('.bk-conn').forEach(conn=>{
    const side=conn.dataset.side; // 'right'=left-half (many→few), 'left'=right-half (few→many)
    const prev=conn.previousElementSibling;
    const next=conn.nextElementSibling;
    if(!prev||!next)return;

    const prevPairs=Array.from(prev.querySelectorAll('.match-pair'));
    const nextPairs=Array.from(next.querySelectorAll('.match-pair'));
    if(!prevPairs.length||!nextPairs.length)return;

    // Use column edges as anchor X, not individual match-pair edges (more reliable)
    const prevColR=prev.getBoundingClientRect().right;
    const nextColL=next.getBoundingClientRect().left;
    const midX=(prevColR+nextColL)/2;

    if(side==='right'){
      // Left half: 2 prev pairs → 1 next pair (converging)
      for(let ni=0;ni<nextPairs.length;ni++){
        const nr=nextPairs[ni].getBoundingClientRect();
        const nY=nr.top+nr.height/2;
        const p0=prevPairs[ni*2]?.getBoundingClientRect();
        const p1=prevPairs[ni*2+1]?.getBoundingClientRect();
        if(!p0||!p1)continue;
        const y0=p0.top+p0.height/2, y1=p1.top+p1.height/2;
        line(prevColR,y0,midX,y0); line(prevColR,y1,midX,y1);
        line(midX,y0,midX,y1);     line(midX,nY,nextColL,nY);
      }
    } else if(side==='right1'){
      // sfL→fin: prev center → fin's top-team row
      if(!prevPairs.length||!nextPairs.length)return;
      const pr=prevPairs[0].getBoundingClientRect();
      const pY=pr.top+pr.height/2;
      const topRow=nextPairs[0].querySelector('.mp-team:first-child');
      const tr=(topRow||nextPairs[0]).getBoundingClientRect();
      const nY=tr.top+tr.height/2;
      line(prevColR,pY,midX,pY);
      line(midX,Math.min(pY,nY),midX,Math.max(pY,nY));
      line(midX,nY,nextColL,nY);
    } else if(side==='left1'){
      // fin→sfR: fin's bottom-team row → next center
      if(!prevPairs.length||!nextPairs.length)return;
      const botRow=prevPairs[0].querySelector('.mp-team:last-child');
      const br=(botRow||prevPairs[0]).getBoundingClientRect();
      const pY=br.top+br.height/2;
      const nr=nextPairs[0].getBoundingClientRect();
      const nY=nr.top+nr.height/2;
      line(prevColR,pY,midX,pY);
      line(midX,Math.min(pY,nY),midX,Math.max(pY,nY));
      line(midX,nY,nextColL,nY);
    } else {
      // Right half: 1 prev pair → 2 next pairs (expanding)
      for(let pi=0;pi<prevPairs.length;pi++){
        const pr=prevPairs[pi].getBoundingClientRect();
        const pY=pr.top+pr.height/2;
        const n0=nextPairs[pi*2]?.getBoundingClientRect();
        const n1=nextPairs[pi*2+1]?.getBoundingClientRect();
        if(!n0||!n1)continue;
        const y0=n0.top+n0.height/2, y1=n1.top+n1.height/2;
        line(nextColL,y0,midX,y0); line(nextColL,y1,midX,y1);
        line(midX,y0,midX,y1);     line(midX,pY,prevColR,pY);
      }
    }
  });

  bk.insertBefore(svg,bk.firstChild);
}

function resetAll(){
  if(!confirm('确定要清除所有预测？'))return;
  slots={};scores={};kscores={};picks={};
  save();saveScores();saveKScores();savePicks();
  renderGroupStage();renderInlineKO();
  toast('已重置所有预测');
}

function encodeState(){return btoa(JSON.stringify({s:scores,b:slots,k:kscores,p:picks}));}
function decodeState(h){try{return JSON.parse(atob(h));}catch{return null;}}

let _sharedMode=false;
function shareLink(){
  const encoded=encodeState();
  const isPublic=location.protocol!=='file:'&&!['localhost','127.0.0.1','::1'].includes(location.hostname)&&!location.hostname.endsWith('.local');
  if(isPublic){
    const url=location.origin+location.pathname+'#'+encoded;
    if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>toast('分享链接已复制！')).catch(()=>prompt('复制链接：',url));}
    else prompt('复制链接：',url);
    return;
  }
  const doc=document.documentElement.cloneNode(true);
  ['#groups-grid','#thirds-section','#ko-rounds','#bracket'].forEach(sel=>{const el=doc.querySelector(sel);if(el)el.innerHTML='';});
  doc.querySelector('#shared-banner').style.display='none';
  const inject=document.createElement('script');inject.textContent=`window.__SHARED__='${encoded}';`;
  const ms=doc.querySelector('script');ms.parentNode.insertBefore(inject,ms);
  const blob=new Blob(['<!DOCTYPE html>\n'+doc.outerHTML],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wc2026.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('已生成分享文件 📁');
}

function showSharedBanner(){_sharedMode=true;document.getElementById('shared-banner').style.display='flex';}
function adoptShared(){save();saveScores();saveKScores();savePicks();_sharedMode=false;document.getElementById('shared-banner').style.display='none';history.replaceState(null,'',location.pathname);toast('已保存！');}
function clearShared(){loadScores();load();loadKScores();loadPicks();_sharedMode=false;document.getElementById('shared-banner').style.display='none';history.replaceState(null,'',location.pathname);renderGroupStage();renderInlineKO();}

function initFromHash(){
  const encoded=window.__SHARED__||location.hash.slice(1);if(!encoded)return;
  const data=decodeState(encoded);if(!data)return;

  showSharedBanner();
}
